name: Hackathon foundation CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AMANAH_DATABASE_URL: postgresql+psycopg://amanah_demo:demo-local-only@127.0.0.1:15432/amanah_demo_test
      TEST_DATABASE_URL: postgresql+psycopg://amanah_demo:demo-local-only@127.0.0.1:15432/amanah_demo_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: amanah_demo_test
          POSTGRES_USER: amanah_demo
          POSTGRES_PASSWORD: demo-local-only
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U amanah_demo -d amanah_demo_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: pip install -r services/api/requirements.lock
      - run: ruff check services/api scripts/check_secrets.py scripts/smoke_stack.py tests
      - run: ruff format --check services/api scripts/check_secrets.py scripts/smoke_stack.py tests
      - run: mypy --config-file services/api/pyproject.toml services/api/src
      - run: pytest -c services/api/pyproject.toml services/api/tests
      - run: python -m unittest discover -s tests
      - run: python scripts/check_secrets.py

  compose-smoke:
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke_stack.py
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs --no-color --tail 60
      - if: always()
        run: docker compose down
