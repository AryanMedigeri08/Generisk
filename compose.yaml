name: amanah-hackathon

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amanah_demo}
      POSTGRES_USER: ${POSTGRES_USER:-amanah_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-local-only}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      AMANAH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-amanah_demo}:${POSTGRES_PASSWORD:-demo-local-only}@db:5432/${POSTGRES_DB:-amanah_demo}
      AMANAH_DEMO_ONLY: "true"
      AMANAH_WEB_ORIGIN: http://localhost:${WEB_PORT:-13000}
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      DEMO_WEB_ORIGIN: http://localhost:${WEB_PORT:-13000}
      NEXT_TELEMETRY_DISABLED: "1"
      ATLAS_OLLAMA_URL: ${ATLAS_OLLAMA_URL:-}
      ATLAS_OLLAMA_MODEL: ${ATLAS_OLLAMA_MODEL:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-13000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20
    security_opt:
      - no-new-privileges:true

volumes:
  demo-data:
